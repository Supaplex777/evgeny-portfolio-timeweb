name: Tests

# Runs the existing test suite and a boot smoke check on every push and PR.
# No secrets are used: all external services (Polza AI, Telegram, S3) are
# stubbed in the tests, and the smoke check only hits routes that need no keys.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Smoke check (/, /health, /terraintel/)
        env:
          PORT: 3999
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3999/health > /dev/null 2>&1 && break
            sleep 1
          done
          set -e
          curl -fsS http://127.0.0.1:3999/health
          echo
          curl -fsS -o /dev/null -w "/ -> %{http_code}\n" http://127.0.0.1:3999/
          curl -fsS -o /dev/null -w "/terraintel/ -> %{http_code}\n" http://127.0.0.1:3999/terraintel/

      - name: Server log
        if: always()
        run: cat server.log 2>/dev/null || true
